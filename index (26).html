<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Quick Ruteo">
<title>Quick Ruteo</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --amarillo:#FFD200; --amarillo-osc:#E6BD00; --negro:#111111; --negro-2:#1E1E1E; --gris:#6B6B6B;
  --gris-cl:#F2F2F0; --borde:#E2E2DE; --blanco:#FFFFFF;
  --rojo:#D93025; --verde:#1E8E3E; --naranja:#F29900; --azul:#1A73E8;
  --radio:14px; --sombra:0 2px 10px rgba(0,0,0,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--gris-cl);color:var(--negro);
  font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
.oculto{display:none!important}

/* ── Login */
#login{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:32px 24px;background:var(--negro);color:#fff}
.marca{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.marca .rayo{width:44px;height:44px;border-radius:12px;background:var(--amarillo);display:grid;place-items:center}
.marca b{font-size:28px;letter-spacing:.5px}
.marca b span{color:var(--amarillo)}
#login p.sub{color:#bdbdbd;margin:0 0 28px}
.campo{display:block;margin-bottom:14px}
.campo span{display:block;font-size:13px;color:#bdbdbd;margin-bottom:6px}
#login input{width:100%;padding:14px 16px;border-radius:12px;border:1px solid #333;background:var(--negro-2);color:#fff;font-size:18px;outline:none}
#login input:focus{border-color:var(--amarillo)}
.btn-pri{width:100%;padding:15px;border-radius:12px;background:var(--amarillo);color:var(--negro);font-weight:700;font-size:16px}
.btn-pri:active{background:var(--amarillo-osc)}
.btn-pri:disabled{opacity:.5}
#loginError{color:#ff8a80;min-height:22px;margin-top:10px;font-size:14px}

/* ── App */
#app{display:flex;flex-direction:column;height:100%}
header{background:var(--negro);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 0}
.fila-top{display:flex;align-items:center;gap:10px}
.fila-top .rayo{width:32px;height:32px;border-radius:9px;background:var(--amarillo);display:grid;place-items:center;flex:none}
.quien{flex:1;min-width:0}
.quien b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quien small{color:#bdbdbd}
.ico-btn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:#fff}
.ico-btn:active{background:#2a2a2a}
#syncBadge{font-size:12px;padding:4px 9px;border-radius:99px;background:#2a2a2a;color:#fff;white-space:nowrap}
#syncBadge.pend{background:var(--naranja);color:var(--negro);font-weight:700}
#syncBadge.err{background:var(--rojo)}
.resumen{display:flex;gap:8px;margin:12px 0}
.kpi{flex:1;background:var(--negro-2);border-radius:12px;padding:8px 10px}
.kpi b{display:block;font-size:20px;color:var(--amarillo)}
.kpi small{color:#bdbdbd;font-size:12px}
.tabs{display:flex}
.tab{flex:1;padding:12px 0;color:#bdbdbd;font-weight:600;border-bottom:3px solid transparent}
.tab.act{color:#fff;border-color:var(--amarillo)}
#demoBanner{background:var(--amarillo);color:var(--negro);text-align:center;font-size:12px;font-weight:700;padding:4px}

main{flex:1;overflow:auto;position:relative}
#vistaLista{padding:12px 12px 90px}
.filtros{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto}
.chip{padding:7px 14px;border-radius:99px;background:#fff;border:1px solid var(--borde);font-size:14px;white-space:nowrap}
.chip.act{background:var(--negro);color:#fff;border-color:var(--negro)}
.vacio{text-align:center;color:var(--gris);padding:48px 16px}

.card{background:#fff;border-radius:var(--radio);box-shadow:var(--sombra);margin-bottom:12px;overflow:hidden;border-left:6px solid var(--borde)}
.card.p-Alta{border-left-color:var(--rojo)} .card.p-Media{border-left-color:var(--naranja)} .card.p-Baja{border-left-color:var(--azul)}
.card.cerrado{opacity:.72;border-left-color:var(--verde)} .card.cerrado.novedad{border-left-color:var(--rojo)}
.card-cab{display:flex;gap:12px;padding:12px 14px 6px;align-items:flex-start}
.num{width:30px;height:30px;border-radius:50%;background:var(--negro);color:var(--amarillo);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.card-tit{flex:1;min-width:0}
.card-tit b{display:block;font-size:16px}
.card-tit .dir{color:var(--gris);font-size:13px}
.etqs{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 8px 56px}
.etq{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--gris-cl)}
.etq.alta{background:#FDE7E7;color:var(--rojo)} .etq.media{background:#FEF1D8;color:#9A6100} .etq.baja{background:#E3EEFD;color:var(--azul)}
.etq.fija{background:var(--negro);color:var(--amarillo)} .etq.adic{background:#FFF6CC;color:#6B5600}
.etq.ok{background:#E6F4EA;color:var(--verde)} .etq.nov{background:#FDE7E7;color:var(--rojo)}
.etq.venc{background:var(--rojo);color:#fff} .etq.porv{background:var(--naranja);color:var(--negro)} .etq.atiempo{background:#E6F4EA;color:var(--verde)}
.etq.sync{background:var(--naranja);color:var(--negro)}
.detalle{padding:0 14px 8px 56px;font-size:13.5px;color:#333}
.detalle div{margin-bottom:3px}
.detalle a{color:var(--azul)}
.acciones{display:flex;border-top:1px solid var(--borde)}
.acciones button{flex:1;padding:12px 6px;font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.acciones button+button{border-left:1px solid var(--borde)}
.acciones .cerrar-btn{background:var(--amarillo)}
.acciones button:active{background:var(--gris-cl)}
.acciones .cerrar-btn:active{background:var(--amarillo-osc)}

#vistaMapa{position:absolute;inset:0}
#mapa{position:absolute;inset:0;background:#e5e3df}
.mapa-ctrl{position:absolute;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:500}
.mapa-ctrl button{flex:1;padding:13px 8px;border-radius:12px;font-weight:700;box-shadow:0 3px 12px rgba(0,0,0,.25)}
.b-neg{background:var(--negro);color:#fff} .b-ama{background:var(--amarillo);color:var(--negro)}
.pin{width:32px;height:32px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.pin span{transform:rotate(45deg);font-weight:800;font-size:13px}
.yo{width:18px;height:18px;border-radius:50%;background:var(--azul);border:3px solid #fff;box-shadow:0 0 0 6px rgba(26,115,232,.25)}
.leaflet-popup-content{margin:10px 12px;font-size:13.5px}
.leaflet-popup-content button{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--amarillo);font-weight:700;width:100%}

/* ── Modal de cierre */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;display:flex;align-items:flex-end}
.hoja{background:#fff;width:100%;max-height:94%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.hoja h2{margin:0 0 2px;font-size:19px}
.hoja .sub{color:var(--gris);font-size:13px;margin-bottom:14px}
.seg{display:flex;background:var(--gris-cl);border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{flex:1;padding:11px;border-radius:9px;font-weight:700;color:var(--gris)}
.seg button.act.ok{background:var(--verde);color:#fff}
.seg button.act.nov{background:var(--rojo);color:#fff}
.hoja label{display:block;font-size:13px;font-weight:600;margin:0 0 6px}
.hoja input[type=text],.hoja select,.hoja textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--borde);background:#fff;margin-bottom:14px;outline:none}
.hoja input:focus,.hoja select:focus,.hoja textarea:focus{border-color:var(--negro)}
.fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.foto{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--gris-cl)}
.foto img{width:100%;height:100%;object-fit:cover}
.foto button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;font-weight:700}
.add-foto{aspect-ratio:1;border-radius:10px;border:2px dashed #c8c8c2;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--gris);font-size:12px;font-weight:600;gap:4px}
.fila-btn{display:flex;gap:10px}
.fila-btn .btn-sec{flex:1;padding:15px;border-radius:12px;background:var(--gris-cl);font-weight:700}
.fila-btn .btn-pri{flex:2}
#cierreError{color:var(--rojo);font-size:14px;min-height:20px;margin-bottom:8px}

#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(140px);background:var(--negro);color:#fff;padding:12px 18px;border-radius:12px;z-index:2000;max-width:90%;transition:transform .25s;box-shadow:0 6px 20px rgba(0,0,0,.3);font-size:14px}
#toast.ver{transform:translateX(-50%) translateY(0)}
#toast.nuevo{background:var(--amarillo);color:var(--negro);font-weight:700}
.menu{position:absolute;right:12px;top:calc(56px + env(safe-area-inset-top));background:#fff;color:var(--negro);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:1500;min-width:220px;overflow:hidden}
.menu button{display:block;width:100%;text-align:left;padding:14px 16px}
.menu button+button{border-top:1px solid var(--borde)}
.cola-item{background:#FFF4E5;border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:13.5px}
.cola-item .fila-btn{margin-top:8px}
.cola-item .fila-btn button{padding:8px;border-radius:8px;font-weight:700;flex:1}
.spin{width:18px;height:18px;border:2.5px solid rgba(0,0,0,.2);border-top-color:var(--negro);border-radius:50%;animation:g .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes g{to{transform:rotate(360deg)}}

/* ── v2: recoge / entrega, trazabilidad, ruteo */
.resumen .kpi b{font-size:18px}
.resumen .kpi small{font-size:11px;line-height:1.2;display:block}
.puntos{padding:0 14px 8px 56px;font-size:13.5px}
.punto{display:flex;gap:8px;align-items:flex-start;margin-bottom:6px}
.punto .ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none;margin-top:1px}
.punto .ic.r{background:var(--amarillo);color:var(--negro)} .punto .ic.e{background:var(--negro);color:var(--amarillo)}
.punto.hecho{opacity:.55} .punto.hecho b::after{content:' ✓';color:var(--verde)}
.punto.sig b{text-decoration:underline;text-decoration-color:var(--amarillo);text-decoration-thickness:3px;text-underline-offset:3px}
.punto small{display:block;color:var(--gris)}
.traza{display:flex;align-items:center;gap:4px;padding:0 14px 10px 56px;font-size:11.5px;color:var(--gris);flex-wrap:wrap}
.traza span{padding:2px 7px;border-radius:99px;background:var(--gris-cl)}
.traza span.ok{background:#E6F4EA;color:var(--verde);font-weight:700}
.traza span.nov{background:#FDE7E7;color:var(--rojo);font-weight:700}
.traza i{font-style:normal;color:#bbb}
.card-tit .accion{font-size:11.5px;font-weight:800;letter-spacing:.4px;color:var(--gris);text-transform:uppercase}
.etq.eta{background:var(--negro);color:#fff}
.etq.sinub{background:#FDE7E7;color:var(--rojo)}
.acciones .aceptar-btn{background:var(--negro);color:var(--amarillo)}
.acciones .aceptar-btn:active{background:#333}
.barra-aceptar{display:flex;align-items:center;gap:10px;background:var(--negro);color:#fff;border-radius:12px;padding:10px 12px;margin-bottom:12px}
.barra-aceptar span{flex:1;font-size:14px}
.barra-aceptar button{background:var(--amarillo);color:var(--negro);font-weight:800;padding:9px 14px;border-radius:9px}
.pin.r{background:var(--amarillo)} .pin.r span{color:var(--negro)}
.pin.e{background:var(--negro)} .pin.e span{color:var(--amarillo)}
.pin.x{background:var(--negro)} .pin.x span{color:#fff}
.pop-item{border-top:1px solid var(--borde);padding-top:6px;margin-top:6px}
.leyenda{position:absolute;top:12px;left:12px;z-index:500;background:#fff;border-radius:10px;padding:7px 10px;font-size:12px;box-shadow:var(--sombra);display:flex;gap:10px}
.leyenda b{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.hoja .ruta-pts{background:var(--gris-cl);border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:13.5px}
.hoja .ruta-pts div+div{margin-top:4px}
</style>
</head>
<body>

<!-- ═════════ LOGIN ═════════ -->
<section id="login" class="oculto">
  <div class="marca">
    <div class="rayo"><svg width="22" height="26" viewBox="0 0 22 26"><path d="M13 0L0 15h8l-2 11L22 10h-9z" fill="#111"/></svg></div>
    <b>QUICK <span>RUTEO</span></b>
  </div>
  <p class="sub">Servicios Clínica La Colina</p>
  <label class="campo"><span>Código de conductor</span><input id="inCodigo" autocomplete="username" autocapitalize="characters" placeholder="Ej: C01"></label>
  <label class="campo"><span>PIN</span><input id="inPin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••"></label>
  <button class="btn-pri" id="btnLogin">Ingresar</button>
  <div id="loginError"></div>
</section>

<!-- ═════════ APP ═════════ -->
<section id="app" class="oculto">
  <div id="demoBanner" class="oculto">MODO DEMO · datos de prueba, nada se guarda</div>
  <header>
    <div class="fila-top">
      <div class="rayo"><svg width="15" height="18" viewBox="0 0 22 26"><path d="M13 0L0 15h8l-2 11L22 10h-9z" fill="#111"/></svg></div>
      <div class="quien"><b id="hNombre">—</b><small id="hFecha"></small></div>
      <span id="syncBadge">En línea</span>
      <button class="ico-btn" id="btnRefrescar" aria-label="Actualizar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></svg>
      </button>
      <button class="ico-btn" id="btnMenu" aria-label="Menú">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
      </button>
    </div>
    <div class="resumen">
      <div class="kpi"><b id="kAcep">0</b><small>Por aceptar</small></div>
      <div class="kpi"><b id="kCurso">0</b><small>En curso</small></div>
      <div class="kpi"><b id="kVenc">0</b><small>Vencidos / por vencer</small></div>
      <div class="kpi"><b id="kCerr">0</b><small>Cerrados hoy</small></div>
    </div>
    <div class="tabs">
      <button class="tab act" data-vista="lista">Lista</button>
      <button class="tab" data-vista="mapa">Mapa</button>
    </div>
  </header>
  <div class="menu oculto" id="menu">
    <button id="mInstalar" class="oculto">📲 Instalar app en el celular</button>
    <button id="mAvisos">🔔 Activar avisos</button>
    <button id="mSalir">↩ Cerrar sesión</button>
  </div>

  <main>
    <div id="vistaLista">
      <div id="colaBox"></div>
      <div class="filtros">
        <button class="chip act" data-f="pend">Activos</button>
        <button class="chip" data-f="cerr">Cerrados</button>
        <button class="chip" data-f="todos">Todos</button>
      </div>
      <div id="lista"></div>
    </div>
    <div id="vistaMapa" class="oculto">
      <div id="mapa"></div>
      <div class="leyenda"><span><b style="background:#FFD200"></b>Recoger</span><span><b style="background:#111"></b>Entregar</span></div>
      <div class="mapa-ctrl">
        <button class="b-neg" id="btnOptimizar">Recalcular ruta</button>
        <button class="b-ama" id="btnNavegar">Navegar ruta ▸</button>
      </div>
    </div>
  </main>
</section>

<!-- ═════════ MODAL CIERRE ═════════ -->
<div class="modal oculto" id="modal">
  <div class="hoja">
    <h2 id="mTitulo">Cerrar servicio</h2>
    <div class="sub" id="mSub"></div>
    <div class="ruta-pts" id="mPuntos"></div>
    <div class="seg">
      <button data-r="OK" class="act ok" id="segOk">✓ Entregado</button>
      <button data-r="Novedad">⚠ Novedad</button>
    </div>
    <div id="boxMotivo" class="oculto">
      <label for="inMotivo">Motivo de la novedad *</label>
      <select id="inMotivo"></select>
    </div>
    <label for="inRecibe" id="lblRecibe">Nombre de quien recibe *</label>
    <input type="text" id="inRecibe" maxlength="120" autocomplete="off">
    <label for="inObs">Observación</label>
    <textarea id="inObs" rows="2" maxlength="500"></textarea>
    <label>Evidencias fotográficas * <small id="cntFotos" style="font-weight:400;color:var(--gris)"></small></label>
    <div class="fotos" id="fotos"></div>
    <input type="file" id="inCamara" accept="image/*" capture="environment" class="oculto">
    <input type="file" id="inGaleria" accept="image/*" multiple class="oculto">
    <div id="cierreError"></div>
    <div class="fila-btn">
      <button class="btn-sec" id="btnCancelar">Cancelar</button>
      <button class="btn-pri" id="btnConfirmar">Guardar</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ════════════════════════════════════════════════════════════════════
   QUICK RUTEO v2 — app del conductor
   CONFIGURACIÓN — URL de la aplicación web de Apps Script.
   Si se deja vacía (o se abre con ?demo=1) la app funciona en modo demo.
   ════════════════════════════════════════════════════════════════════ */
const API_URL = 'https://script.google.com/macros/s/AKfycbxgPy7DS3kbzbGOW1HVq1kkGi__fXHjUVe2m6jSjc5TcGAOpyDna0Z-EH1bcC0UInsr/exec';

const FOTOS_MIN = {R: 1, E: 1}, FOTOS_MAX = 5, FOTO_LADO = 1280, FOTO_CALIDAD = 0.7;
const POLL_MS = 60000, MIN_POR_VENCER = 30;
// Ruteo: velocidad urbana promedio, factor calles vs línea recta, minutos por parada
const RUTA = {VEL_KMH: 18, FACTOR: 1.35, MIN_PARADA: 6, PEN_PRIORIDAD: {Alta: 0, Media: 15, Baja: 30}, MISMO_PUNTO_KM: 0.12};
const MOTIVOS = ['Destinatario ausente','Área cerrada','Dirección errada','Rechazado por el cliente',
  'Sin acceso / seguridad','Elemento no listo para recoger','Equipo no disponible','Reprogramado por el cliente','Otro'];
const RANGO_P = {Alta:0, Media:1, Baja:2};
const DEMO = !API_URL || new URLSearchParams(location.search).has('demo');

const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};

let S = {
  sesion: ls.get('qr_sesion', null),
  servicios: ls.get('qr_servicios', []),
  vista: 'lista', filtro: 'pend', abierto: null,
  pos: null, idsVistos: null, cola: [], sincronizando: false,
  cierre: null, mapa: null, capa: null, plan: null
};

/* ───────────── IndexedDB: cola de eventos (aceptar / recoger / entregar, con fotos) ───────────── */
const DB = (() => {
  let dbp = null;
  function abrir(){
    if (dbp) return dbp;
    dbp = new Promise((ok, mal) => {
      const r = indexedDB.open('quickruteo', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('cola', {keyPath: 'jobId'});
      r.onsuccess = () => ok(r.result); r.onerror = () => mal(r.error);
    });
    return dbp;
  }
  async function tx(modo, fn){
    const db = await abrir();
    return new Promise((ok, mal) => {
      const t = db.transaction('cola', modo); const st = t.objectStore('cola');
      const res = fn(st); t.oncomplete = () => ok(res && res.result); t.onerror = () => mal(t.error);
    });
  }
  return {
    todos: () => tx('readonly', st => st.getAll()),
    poner: (j) => tx('readwrite', st => st.put(j)),
    quitar: (id) => tx('readwrite', st => st.delete(id))
  };
})();

/* ───────────── API ───────────── */
async function api(accion, datos){
  if (DEMO) return demoApi(accion, datos || {});
  const cuerpo = Object.assign({accion, token: S.sesion && S.sesion.token}, datos || {});
  let r;
  try {
    r = await fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(cuerpo), redirect:'follow'});
  } catch(e){ const err = new Error('Sin conexión'); err.red = true; throw err; }
  if (!r.ok){ const err = new Error('Servidor no disponible ('+r.status+')'); err.red = true; throw err; }
  const j = await r.json();
  if (!j.ok){
    if (j.error === 'SESION'){ salir(true); }
    const err = new Error(j.mensaje || j.error || 'Error'); err.servidor = true; throw err;
  }
  return j;
}

/* ───────────── Fechas ───────────── */
function hoyTxt(){ const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function minutosAhora(){ const d = new Date(); return d.getHours()*60 + d.getMinutes(); }
function aMin(h){ if (!h) return null; const [a,b] = h.split(':').map(Number); return isNaN(a) ? null : a*60+(b||0); }
function aHora(m){ if (m == null || m >= 1440) return ''; m = Math.round(m); return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }
function hhmm(iso){ const d = new Date(iso); return isNaN(d) ? '' : String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function fechaLarga(){ return new Date().toLocaleDateString('es-CO',{weekday:'long', day:'numeric', month:'long'}); }

/* ───────────── Carga y sondeo ───────────── */
async function cargar(silencioso){
  if (!S.sesion) return;
  try {
    const r = await api('servicios', {});
    const ids = new Set(r.servicios.map(s => s.id));
    if (S.idsVistos){
      const nuevos = r.servicios.filter(s => !S.idsVistos.has(s.id) && abierto(s));
      if (nuevos.length) avisarNuevos(nuevos);
    }
    S.idsVistos = ids;
    S.servicios = r.servicios.map(normalizarServicio);
    ls.set('qr_servicios', S.servicios);
    estadoRed(true);
    render();
  } catch(e){
    if (e.red) estadoRed(false);
    if (!silencioso) toast(e.red ? 'Sin conexión: mostrando la última información guardada' : e.message);
  }
}
function normalizarServicio(s){
  if (s.estado === 'En curso') s.estado = 'Aceptado';
  ['lat','lng','latO','lngO'].forEach(k => { const n = parseFloat(String(s[k] ?? '').replace(',', '.')); s[k] = isFinite(n) && n !== 0 ? n : null; });
  return s;
}
setInterval(() => { if (document.visibilityState === 'visible'){ cargar(true); procesarCola(); ubicar(); } }, POLL_MS);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.sesion){ $('#hFecha').textContent = fechaLarga(); cargar(true); procesarCola(); } });
window.addEventListener('online', () => { estadoRed(true); procesarCola(); cargar(true); });
window.addEventListener('offline', () => estadoRed(false));

let enLinea = navigator.onLine;
function estadoRed(v){ enLinea = v; pintarSync(); }

function ubicar(){
  return new Promise(ok => {
    if (!navigator.geolocation) return ok(S.pos);
    navigator.geolocation.getCurrentPosition(p => {
      const nuevo = !S.pos;
      S.pos = {lat: +p.coords.latitude.toFixed(6), lng: +p.coords.longitude.toFixed(6)};
      if (nuevo) render(); else if (S.mapa) pintarYo();
      if (S.sesion && enLinea) api('ubicacion', S.pos).catch(() => {});
      ok(S.pos);
    }, () => ok(S.pos), {enableHighAccuracy:true, timeout:10000, maximumAge:60000});
  });
}

/* ───────────── Avisos de servicios nuevos ───────────── */

    : nuevos.length + ' servicios nuevos asignados';

  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, .22].forEach(t => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(.25, ctx.currentTime+t); g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime+t+.18); o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+.2); });
  } catch(e){}
  if ('Notification' in window && Notification.permission === 'granted' && navigator.serviceWorker){
    navigator.serviceWorker.ready.then(reg => reg.showNotification('Quick Ruteo', {body: txt, icon:'icons/icon-192.png', badge:'icons/icon-192.png', tag:'nuevos', renotify:true})).catch(()=>{});
  }

/* ───────────── Estados y etapas ───────────── */
function abierto(s){ return ['Pendiente','Aceptado','Recogido','En curso'].includes(s.estado); }
function tieneOrigen(s){ return !!(s.sedeOrigen || s.dirOrigen || (s.latO && s.lngO)); }
/** Próximo paso del servicio: aceptar → recoger → entregar */
function paso(s){
  if (!abierto(s)) return null;
  if (s.estado === 'Pendiente') return 'aceptar';
  if (s.estado === 'Aceptado' && tieneOrigen(s)) return 'recoger';
  return 'entregar';
}
/** Aplica sobre el servicio los eventos que aún están en la cola del celular. */
function vista(s){
  const jobs = S.cola.filter(j => j.id === s.id);
  if (!jobs.length) return s;
  const v = Object.assign({}, s, {_sync: true, _err: jobs.some(j => j.error) ? jobs.find(j => j.error).error : null});
  jobs.forEach(j => {
    if (j.tipo === 'aceptar' && v.estado === 'Pendiente'){ v.estado = 'Aceptado'; v.horaAceptado = v.horaAceptado || hhmm(j.hora); }
    if (j.tipo === 'recoger' && abierto(v)){ v.estado = 'Recogido'; v.horaAceptado = v.horaAceptado || hhmm(j.hora); v.horaRecogido = hhmm(j.hora); v.entregaOrigen = j.persona; }
    if (j.tipo === 'cerrar'){ v.estado = j.estado; v.horaAceptado = v.horaAceptado || hhmm(j.hora); v.horaCierre = hhmm(j.hora); v.recibe = j.persona; v.motivo = j.motivo; }
  });
  return v;
}
function semaforo(s){
  if (!abierto(s)) return null;
  if (s.fecha && s.fecha < hoyTxt()) return {c:'venc', t:'Atrasado de ' + s.fecha.slice(5)};
  const h = aMin(s.hasta); if (h == null) return null;
  const falta = h - minutosAhora();
  if (falta < 0) return {c:'venc', t:'Vencido ' + s.hasta};
  if (falta <= MIN_POR_VENCER) return {c:'porv', t:'Vence en ' + falta + ' min'};
  return {c:'atiempo', t:'A tiempo'};
}

/* ───────────── RUTEO LÓGICO ─────────────
   Cada servicio genera hasta dos paradas: RECOGER (origen) y ENTREGAR (destino).
   Reglas, en este orden de peso:
   1. Nunca se entrega algo que no se ha recogido (la entrega espera a su recogida).
   2. Ventanas: no se llega antes de "Desde" (se cuenta la espera) y se adelanta lo que va a vencer "Hasta".
   3. Prioridad: Media equivale a 15 min más de recorrido que Alta; Baja, 30 min.
   4. Distancia: se va a la parada factible más cercana desde donde está el conductor.
   5. Consolidación: si ya está en un sitio, hace ahí todo lo que pueda (recoger varios a la vez).
   Paradas consecutivas en el mismo sitio (p. ej. 3 recogidas en La Colina) se agrupan en una sola. */
function km(a, b){
  const R = 6371, dLat = (b.lat-a.lat)*Math.PI/180, dLng = (b.lng-a.lng)*Math.PI/180;
  const x = Math.sin(dLat/2)**2 + Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
function minViaje(a, b){ return a && b ? km(a, b) * RUTA.FACTOR / RUTA.VEL_KMH * 60 : 0; }

function planificar(lista){
  const paradasSueltas = [], sinUbic = [];
  lista.filter(abierto).forEach(s => {
    const necesitaR = tieneOrigen(s) && s.estado !== 'Recogido';
    const pR = s.latO && s.lngO ? {lat: s.latO, lng: s.lngO} : null;
    const pE = s.lat && s.lng ? {lat: s.lat, lng: s.lng} : null;
    if ((necesitaR && !pR) || !pE){ sinUbic.push(s.id); return; }
    const base = {s, prio: s.prioridad || 'Media', desde: aMin(s.desde), hasta: aMin(s.hasta), atrasado: s.fecha && s.fecha < hoyTxt()};
    if (necesitaR) paradasSueltas.push(Object.assign({key: s.id+'|R', tipo:'R', lat:pR.lat, lng:pR.lng, destino: pE}, base));
    paradasSueltas.push(Object.assign({key: s.id+'|E', tipo:'E', lat:pE.lat, lng:pE.lng, requiere: necesitaR ? s.id+'|R' : null}, base));
  });

  let cur = S.pos, t = minutosAhora();
  const pend = paradasSueltas.slice(), hechas = new Set(), seq = [];
  while (pend.length){
    let mejor = null;
    pend.forEach((p, i) => {
      if (p.requiere && !hechas.has(p.requiere)) return;
      const viaje = minViaje(cur, p);
      let llega = t + viaje;
      const esPrimera = p.tipo === 'R' || (!p.requiere && !tieneOrigen(p.s));   // "Desde" aplica a la primera parada del servicio
      const espera = (esPrimera && p.desde != null && llega < p.desde) ? p.desde - llega : 0;
      // La espera pesa 1,5×: es tiempo muerto mientras otros servicios podrían avanzar
      let costo = viaje + espera * 1.5 + (RUTA.PEN_PRIORIDAD[p.prio] ?? 15);
      if (cur && km(cur, p) < RUTA.MISMO_PUNTO_KM) costo -= 25;   // ya está en el sitio: consolidar
      if (p.atrasado) costo -= 40;
      else if (p.hasta != null){
        const fin = p.tipo === 'R' ? llega + espera + RUTA.MIN_PARADA + minViaje(p, p.destino) : llega + espera;
        const holgura = p.hasta - fin;
        costo -= holgura < 0 ? 35 : holgura < 30 ? 22 : holgura < 60 ? 8 : 0;
      }
      if (p.tipo === 'E' && p.requiere) costo -= 4;   // no llevar carga más tiempo del necesario
      if (!mejor || costo < mejor.costo) mejor = {i, costo, llega: llega + espera};
    });
    if (!mejor) break;
    const p = pend.splice(mejor.i, 1)[0];
    p.eta = mejor.llega; seq.push(p); hechas.add(p.key);
    t = mejor.llega + RUTA.MIN_PARADA; cur = p;
  }

  // Agrupar paradas consecutivas en el mismo sitio
  const paradas = [];
  seq.forEach(p => {
    const ult = paradas[paradas.length-1];
    if (ult && km(ult, p) < RUTA.MISMO_PUNTO_KM) ult.items.push(p);
    else paradas.push({lat: p.lat, lng: p.lng, eta: p.eta, items: [p]});
  });
  paradas.forEach((pa, i) => {
    pa.n = i + 1;
    const a = pa.items[0];
    pa.nombre = a.tipo === 'R' ? (a.s.sedeOrigen || a.s.dirOrigen) : (a.s.sedeDestino || a.s.direccion);
    pa.dir = a.tipo === 'R' ? a.s.dirOrigen : a.s.direccion;
    pa.tipos = new Set(pa.items.map(x => x.tipo));
  });
  // Índice por servicio: primera parada (próxima acción) y ETA de entrega
  const porServicio = new Map();
  paradas.forEach(pa => pa.items.forEach(it => {
    const o = porServicio.get(it.s.id) || {};
    if (!o.n){ o.n = pa.n; o.tipo = it.tipo; o.eta = pa.eta; }
    if (it.tipo === 'E') o.etaE = pa.eta;
    porServicio.set(it.s.id, o);
  }));
  return {paradas, porServicio, sinUbic};
}

/* ───────────── Render lista ───────────── */
function render(){
  const todos = S.servicios.map(vista);
  const abiertos = todos.filter(abierto), cerr = todos.filter(s => !abierto(s));
  S.plan = planificar(todos);
  const ps = S.plan.porServicio;
  abiertos.sort((a,b) => (ps.get(a.id)?.n ?? 999) - (ps.get(b.id)?.n ?? 999) || (RANGO_P[a.prioridad] ?? 1) - (RANGO_P[b.prioridad] ?? 1));
  cerr.sort((a,b) => (b.horaCierre||'').localeCompare(a.horaCierre||''));

  $('#kAcep').textContent = abiertos.filter(s => s.estado === 'Pendiente').length;
  $('#kCurso').textContent = abiertos.filter(s => s.estado !== 'Pendiente').length;
  $('#kVenc').textContent = abiertos.filter(s => { const x = semaforo(s); return x && x.c !== 'atiempo'; }).length;
  $('#kCerr').textContent = cerr.filter(s => s.fecha === hoyTxt() || s._sync).length;

  const ver = S.filtro === 'pend' ? abiertos : S.filtro === 'cerr' ? cerr : abiertos.concat(cerr);
  const porAceptar = abiertos.filter(s => s.estado === 'Pendiente' && !s._sync);
  const barra = (S.filtro !== 'cerr' && porAceptar.length > 1)
    ? `<div class="barra-aceptar"><span><b>${porAceptar.length}</b> servicios por aceptar</span><button id="btnAceptarTodos">Aceptar todos</button></div>` : '';
  $('#lista').innerHTML = barra + (ver.length ? ver.map(tarjeta).join('') :
    `<div class="vacio">${S.filtro === 'pend' ? '🎉 No tienes servicios activos.<br><small>Los nuevos aparecerán aquí automáticamente.</small>' : 'Sin servicios en esta vista.'}</div>`);
  const bt = $('#btnAceptarTodos'); if (bt) bt.onclick = () => aceptar(porAceptar);
  pintarCola();
  if (S.mapa && S.vista === 'mapa') pintarMapa();
}

const ACCION_TXT = {aceptar: 'Por aceptar', recoger: 'Siguiente: recoger', entregar: 'Siguiente: entregar'};
function tarjeta(s){
  const sem = semaforo(s), cerrado = !abierto(s), p = paso(s), r = S.plan.porServicio.get(s.id);
  const conOrigen = tieneOrigen(s);
  const ventana = s.desde || s.hasta ? `🕑 ${s.desde || '—'} – ${s.hasta || '—'}` : '';
  const etq = [];
  etq.push(`<span class="etq ${s.tipo === 'Ruta fija' ? 'fija' : 'adic'}">${s.tipo === 'Ruta fija' ? 'RUTA FIJA' : 'ADICIONAL'}</span>`);
  if (!cerrado) etq.push(`<span class="etq ${(s.prioridad||'media').toLowerCase()}">${esc(s.prioridad||'Media')}</span>`);
  if (ventana) etq.push(`<span class="etq">${ventana}</span>`);
  if (sem && sem.c !== 'atiempo') etq.push(`<span class="etq ${sem.c}">${sem.t}</span>`);
  if (!cerrado && r) etq.push(`<span class="etq eta">Parada ${r.n} · llega ${aHora(r.eta)}</span>`);
  if (!cerrado && r && r.etaE && aMin(s.hasta) != null && r.etaE > aMin(s.hasta) && !(sem && sem.c === 'venc')) etq.push(`<span class="etq porv">Entrega estimada ${aHora(r.etaE)}</span>`);
  if (!cerrado && S.plan.sinUbic.includes(s.id)) etq.push(`<span class="etq sinub">Dirección sin ubicar en mapa</span>`);
  if (s._sync) etq.push(`<span class="etq sync">${s._err ? 'Error al enviar' : 'Pendiente de enviar'}</span>`);

  // Recoge / Entrega siempre visibles
  const recogido = s.estado === 'Recogido' || (!abierto(s) && s.horaRecogido);
  const puntos = `<div class="puntos">
    ${conOrigen ? `<div class="punto ${recogido ? 'hecho' : ''} ${p === 'recoger' || p === 'aceptar' ? 'sig' : ''}"><div class="ic r">↑</div>
      <div><b>Recoge: ${esc(s.sedeOrigen || s.dirOrigen)}</b>${s.dirOrigen && s.dirOrigen !== s.sedeOrigen ? `<small>${esc(s.dirOrigen)}</small>` : ''}</div></div>` : ''}
    <div class="punto ${s.estado === 'Entregado' ? 'hecho' : ''} ${p === 'entregar' || (!conOrigen && p === 'aceptar') ? 'sig' : ''}"><div class="ic e">↓</div>
      <div><b>${conOrigen ? 'Entrega' : (s.tipo === 'Ruta fija' ? 'Parada' : 'Entrega')}: ${esc(s.sedeDestino || s.direccion || 'Sin destino')}</b>${s.direccion && s.direccion !== s.sedeDestino ? `<small>${esc(s.direccion)}</small>` : ''}</div></div>
  </div>`;

  // Trazabilidad
  const pasos = [`<span class="${s.horaAceptado ? 'ok' : ''}">Aceptado ${s.horaAceptado || '—'}</span>`];
  if (conOrigen) pasos.push(`<span class="${s.horaRecogido ? 'ok' : ''}">Recogido ${s.horaRecogido || '—'}</span>`);
  pasos.push(s.estado === 'Novedad' ? `<span class="nov">Novedad ${s.horaCierre || ''}</span>`
    : s.estado === 'Cancelado' ? `<span class="nov">Cancelado</span>`
    : `<span class="${s.estado === 'Entregado' ? 'ok' : ''}">Entregado ${s.estado === 'Entregado' ? (s.horaCierre || '') : '—'}</span>`);
  const traza = `<div class="traza">${pasos.join('<i>›</i>')}</div>`;

  const abiertoDet = S.abierto === s.id;
  const det = abiertoDet ? `<div class="detalle">
      ${s.descripcion ? `<div>📦 ${esc(s.descripcion)}</div>` : ''}
      ${s.solicitud ? `<div># ${esc(s.origen || '')} ${esc(s.solicitud)}</div>` : ''}
      ${s.contacto ? `<div>☎ ${contactoHtml(s.contacto)}</div>` : ''}
      ${s.entregaOrigen ? `<div>✍ Entregó en origen: ${esc(s.entregaOrigen)}</div>` : ''}
      ${s.recibe ? `<div>✍ Recibió: ${esc(s.recibe)}</div>` : ''}
      ${s.motivo ? `<div>⚠ ${esc(s.motivo)}</div>` : ''}
      <div style="color:var(--gris)">ID ${esc(s.id)}</div>
    </div>` : '';
  const boton = p === 'aceptar' ? `<button class="aceptar-btn" data-acc="aceptar" data-id="${esc(s.id)}">Aceptar</button>`
    : p === 'recoger' ? `<button class="cerrar-btn" data-acc="recoger" data-id="${esc(s.id)}">Recoger ↑</button>`
    : `<button class="cerrar-btn" data-acc="entregar" data-id="${esc(s.id)}">${conOrigen || s.tipo !== 'Ruta fija' ? 'Entregar ✓' : 'Completar ✓'}</button>`;
  const acc = cerrado ? '' : `<div class="acciones">
      <button data-acc="nav" data-id="${esc(s.id)}">🧭 Navegar</button>
      <button data-acc="det" data-id="${esc(s.id)}">${abiertoDet ? 'Menos' : 'Detalle'}</button>
      ${boton}
    </div>`;
  const num = cerrado ? (s.estado === 'Entregado' ? '✓' : '!') : (r ? r.n : '·');
  return `<div class="card p-${esc(s.prioridad)} ${cerrado ? 'cerrado' : ''} ${s.estado === 'Novedad' || s.estado === 'Cancelado' ? 'novedad' : ''}" data-id="${esc(s.id)}">
    <div class="card-cab" data-acc="det" data-id="${esc(s.id)}">
      <div class="num">${num}</div>
      <div class="card-tit"><div class="accion">${cerrado ? esc(s.estado) : ACCION_TXT[p]}</div>
        <div class="etqs" style="padding:4px 0 0">${etq.join('')}</div></div>
    </div>
    ${puntos}${traza}${det}${acc}</div>`;
}
function contactoHtml(c){
  const tel = (c.match(/\+?\d[\d\s-]{6,}\d/) || [])[0];
  return tel ? esc(c).replace(esc(tel), `<a href="tel:${tel.replace(/[\s-]/g,'')}">${esc(tel)}</a>`) : esc(c);
}

function servicioVista(id){ const s = S.servicios.find(x => x.id === id); return s ? vista(s) : null; }
function accion(acc, id){
  const s = servicioVista(id); if (!s) return;
  if (acc === 'det'){ S.abierto = S.abierto === id ? null : id; render(); }
  if (acc === 'nav') navegarServicio(s);
  if (acc === 'aceptar') aceptar([s]);
  if (acc === 'recoger') abrirCierre(s, 'R');
  if (acc === 'entregar') abrirCierre(s, 'E');
}

/* ───────────── Aceptar (uno o varios) ───────────── */
async function aceptar(lista){
  const pos = await posicionActual();
  const ahora = new Date().toISOString();
  for (const s of lista){
    if (s.estado !== 'Pendiente' || S.cola.some(j => j.id === s.id && j.tipo === 'aceptar')) continue;
    const job = {jobId: nuevoJob(), tipo:'aceptar', id: s.id, hora: ahora, lat: pos && pos.lat, lng: pos && pos.lng, fotos: [], subidas: [], error: null, creado: Date.now()};
    await DB.poner(job); S.cola.push(job);
  }
  render();
  toast(lista.length > 1 ? '✓ ' + lista.length + ' servicios aceptados' : '✓ Servicio aceptado');
  procesarCola();
}
function nuevoJob(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

/* ───────────── Navegación con Google Maps ───────────── */
function puntoTxt(lat, lng, dir){ return (lat && lng) ? lat + ',' + lng : (dir ? dir + ', Bogotá' : null); }
function navegarServicio(s){
  const p = paso(s);
  const haciaOrigen = (p === 'recoger' || p === 'aceptar') && tieneOrigen(s);
  const dest = haciaOrigen ? puntoTxt(s.latO, s.lngO, s.dirOrigen || s.sedeOrigen) : puntoTxt(s.lat, s.lng, s.direccion || s.sedeDestino);
  if (!dest){ toast('Este servicio no tiene dirección'); return; }
  abrirMaps([dest]);
}
function abrirMaps(puntos){
  const dest = puntos[puntos.length-1], wps = puntos.slice(0,-1);
  let url = 'https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=' + encodeURIComponent(dest);
  if (wps.length) url += '&waypoints=' + encodeURIComponent(wps.join('|'));
  window.open(url, '_blank');
}
$('#btnNavegar').onclick = () => {
  const pa = S.plan ? S.plan.paradas : [];
  if (!pa.length){ toast('No hay paradas con ubicación'); return; }
  if (pa.length > 10) toast('Google Maps admite 10 paradas: se abren las 10 siguientes');
  abrirMaps(pa.slice(0, 10).map(x => x.lat + ',' + x.lng));
};

/* ───────────── Mapa ───────────── */
function cambiarVista(v){
  S.vista = v;
  $$('.tab').forEach(t => t.classList.toggle('act', t.dataset.vista === v));
  $('#vistaLista').classList.toggle('oculto', v !== 'lista');
  $('#vistaMapa').classList.toggle('oculto', v !== 'mapa');
  if (v === 'mapa'){
    if (!window.L){ toast('El mapa necesita conexión la primera vez'); return; }
    if (!S.mapa){
      S.mapa = L.map('mapa', {zoomControl:false}).setView([4.70, -74.06], 12);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© OpenStreetMap'}).addTo(S.mapa);
      L.control.zoom({position:'topright'}).addTo(S.mapa);
      S.capa = L.layerGroup().addTo(S.mapa);
    }
    setTimeout(() => { S.mapa.invalidateSize(); pintarMapa(true); }, 60);
    ubicar();
  }
}
let yoMarker = null;
function pintarYo(){
  if (!S.pos || !S.mapa) return;
  if (!yoMarker) yoMarker = L.marker([S.pos.lat, S.pos.lng], {icon: L.divIcon({className:'', html:'<div class="yo"></div>', iconSize:[18,18]}), zIndexOffset:1000}).addTo(S.mapa);
  else yoMarker.setLatLng([S.pos.lat, S.pos.lng]);
}
function pintarMapa(encuadrar){
  if (!S.mapa || !S.plan) return;
  S.capa.clearLayers();
  const limites = [];
  const colorP = (items) => items.some(x => x.prio === 'Alta') ? '#D93025' : items.some(x => x.prio === 'Media') ? '#F29900' : '#1A73E8';
  // Cerrados hoy, tenues en su destino
  S.servicios.map(vista).filter(s => !abierto(s) && s.lat && s.lng).forEach(s => {
    L.marker([s.lat, s.lng], {opacity:.5, icon: L.divIcon({className:'', iconSize:[24,24], iconAnchor:[12,24],
      html:`<div class="pin" style="width:24px;height:24px;background:${s.estado === 'Entregado' ? '#1E8E3E' : '#D93025'}"><span style="color:#fff;font-size:11px">${s.estado === 'Entregado' ? '✓' : '!'}</span></div>`})})
      .bindPopup(`<b>${esc(s.sedeDestino || s.id)}</b><br><small>${esc(s.estado)} ${s.horaCierre || ''}</small>`).addTo(S.capa);
  });
  S.plan.paradas.forEach(pa => {
    const clase = pa.tipos.size > 1 ? 'x' : pa.tipos.has('R') ? 'r' : 'e';
    const icon = L.divIcon({className:'', iconSize:[32,32], iconAnchor:[16,32], popupAnchor:[0,-30],
      html:`<div class="pin ${clase}" style="border-color:${colorP(pa.items)}"><span>${pa.n}</span></div>`});
    const items = pa.items.map(it => {
      const s = it.s, p = paso(s);
      const btn = p === 'aceptar' ? `<button onclick="accionMapa('aceptar','${esc(s.id)}')">Aceptar</button>`
        : (it.tipo === 'R' && p === 'recoger') ? `<button onclick="accionMapa('recoger','${esc(s.id)}')">Recoger</button>`
        : (it.tipo === 'E' && p === 'entregar') ? `<button onclick="accionMapa('entregar','${esc(s.id)}')">Entregar</button>` : '';
      return `<div class="pop-item">${it.tipo === 'R' ? '↑ <b>Recoger</b>' : '↓ <b>Entregar</b>'} · ${esc(s.prioridad)}${s.hasta ? ' · hasta ' + s.hasta : ''}<br>
        <small>${it.tipo === 'R' ? 'Para: ' + esc(s.sedeDestino || s.direccion) : (tieneOrigen(s) ? 'Desde: ' + esc(s.sedeOrigen || s.dirOrigen) : esc(s.descripcion || ''))}</small>${btn}</div>`;
    }).join('');
    L.marker([pa.lat, pa.lng], {icon, zIndexOffset: 500 - pa.n}).addTo(S.capa)
      .bindPopup(`<b>${pa.n}. ${esc(pa.nombre || '')}</b><br><small>${esc(pa.dir || '')}${pa.dir ? '<br>' : ''}Llegada estimada ${aHora(pa.eta)}</small>${items}`, {maxWidth: 260});
    limites.push([pa.lat, pa.lng]);
  });
  const linea = S.plan.paradas.map(pa => [pa.lat, pa.lng]);
  if (S.pos) linea.unshift([S.pos.lat, S.pos.lng]);
  if (linea.length > 1) L.polyline(linea, {color:'#111', weight:3, opacity:.6, dashArray:'6 8'}).addTo(S.capa);
  pintarYo();
  if (encuadrar){
    if (S.pos) limites.push([S.pos.lat, S.pos.lng]);
    if (limites.length > 1) S.mapa.fitBounds(limites, {padding:[50,50], maxZoom:16});
    else if (limites.length === 1) S.mapa.setView(limites[0], 15);
    if (S.plan.sinUbic.length) toast(S.plan.sinUbic.length + ' servicio(s) sin ubicación: revisa la lista');
  }
}

async function agregarFotos(files){
  for (const f of Array.from(files || [])){
    if (S.cierre.fotos.length >= FOTOS_MAX) break;
    try { S.cierre.fotos.push(await comprimir(f)); } catch(e){ toast('No se pudo leer una foto'); }

}

function comprimir(file){
  return new Promise((ok, mal) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, FOTO_LADO / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const g = c.getContext('2d'); g.drawImage(img, 0, 0, c.width, c.height);
      // Sello: fecha, hora, etapa e ID del servicio
      const sello = new Date().toLocaleString('es-CO') + ' · ' + (S.cierre.etapa === 'R' ? 'RECOGIDA' : 'ENTREGA') + ' · ' + S.cierre.s.id;
      const fs = Math.max(14, Math.round(c.width / 45));
      g.font = `bold ${fs}px sans-serif`;
      const w = g.measureText(sello).width + fs;
      g.fillStyle = 'rgba(0,0,0,.6)'; g.fillRect(0, c.height - fs*1.8, w, fs*1.8);
      g.fillStyle = '#FFD200'; g.fillText(sello, fs/2, c.height - fs*0.55);
      URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg', FOTO_CALIDAD));
    };
    img.onerror = () => { URL.revokeObjectURL(url); mal(new Error('imagen')); };
    img.src = url;
  });
}

function posicionActual(){
  return new Promise(ok => {
    if (!navigator.geolocation) return ok(S.pos);
    navigator.geolocation.getCurrentPosition(p => { S.pos = {lat:+p.coords.latitude.toFixed(6), lng:+p.coords.longitude.toFixed(6)}; ok(S.pos); },
      () => ok(S.pos), {enableHighAccuracy:true, timeout:8000, maximumAge:30000});
  });
}

/* ───────────── Cola de envío (funciona sin señal, en orden) ───────────── */
async function procesarCola(){
  try { S.cola = (await DB.todos()).sort((a,b) => a.creado - b.creado); } catch(e){}
  pintarSync();
  if (S.sincronizando || !S.sesion || !S.cola.length) return;
  S.sincronizando = true; pintarSync();
  const bloqueados = new Set();   // si un evento de un servicio falla, los siguientes del mismo servicio esperan
  try {
    for (const job of S.cola.slice()){
      if (job.error || bloqueados.has(job.id)){ bloqueados.add(job.id); continue; }
      try {
        for (let i = 0; i < job.fotos.length; i++){
          if (job.subidas[i]) continue;
          await api('subirFoto', {id: job.id, etapa: job.etapaFotos, lote: job.jobId, idx: i, data: job.fotos[i]});
          job.subidas[i] = true; await DB.poner(job);
        }
        const base = {id: job.id, hora: job.hora, lat: job.lat, lng: job.lng};
        if (job.tipo === 'aceptar') await api('aceptar', base);
        else if (job.tipo === 'recoger') await api('recoger', Object.assign(base, {persona: job.persona, observacion: job.observacion}));
        else await api('cerrar', Object.assign(base, {estado: job.estado, motivo: job.motivo, persona: job.persona, observacion: job.observacion}));
        await DB.quitar(job.jobId);
        S.cola = S.cola.filter(j => j.jobId !== job.jobId);
        const s = S.servicios.find(x => x.id === job.id);
        if (s){
          const h = hhmm(job.hora);
          if (job.tipo === 'aceptar' && s.estado === 'Pendiente'){ s.estado = 'Aceptado'; s.horaAceptado = s.horaAceptado || h; }
          if (job.tipo === 'recoger'){ s.estado = 'Recogido'; s.horaAceptado = s.horaAceptado || h; s.horaRecogido = h; s.entregaOrigen = job.persona; }
          if (job.tipo === 'cerrar'){ s.estado = job.estado; s.horaAceptado = s.horaAceptado || h; s.horaCierre = h; s.recibe = job.persona; s.motivo = job.motivo; }
          ls.set('qr_servicios', S.servicios);
        }
      } catch(e){
        if (e.red){ estadoRed(false); break; }
        job.error = e.message; await DB.poner(job); bloqueados.add(job.id);
      }
    }
  } finally { S.sincronizando = false; render(); }
}
function pintarSync(){
  const b = $('#syncBadge'); const n = S.cola.length, errs = S.cola.filter(j => j.error).length;
  b.className = '';
  if (errs){ b.classList.add('err'); b.textContent = errs + ' con error'; }
  else if (S.sincronizando){ b.classList.add('pend'); b.textContent = 'Enviando ' + n + '…'; }
  else if (n){ b.classList.add('pend'); b.textContent = n + ' sin enviar'; }
  else b.textContent = enLinea ? 'En línea' : 'Sin señal';
}
